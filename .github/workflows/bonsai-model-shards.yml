name: Bonsai Model Shards

on:
  pull_request:
    branches:
      - main
    paths:
      - experiments/bonsai-model-shards/**
  workflow_dispatch:

concurrency:
  group: bonsai-model-shards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODEL_SHA256: 868c11714cf8fe47f5ec9eeb2be0ab1a337112886f92ee0ede6b855c4fa31757

jobs:
  shard-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and shard complete model
        shell: bash
        run: |
          set -euo pipefail
          df -h . | tee disk-before.txt
          curl -L --fail --retry 8 --retry-delay 10 \
            -o Ternary-Bonsai-27B-Q2_0.gguf \
            https://huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf/resolve/main/Ternary-Bonsai-27B-Q2_0.gguf
          stat -c 'model_bytes=%s' Ternary-Bonsai-27B-Q2_0.gguf | tee model-size.txt
          sha256sum Ternary-Bonsai-27B-Q2_0.gguf | tee model-sha256.txt
          test "$(sha256sum Ternary-Bonsai-27B-Q2_0.gguf | awk '{print $1}')" = "$MODEL_SHA256"
          split -b 450M -d -a 2 Ternary-Bonsai-27B-Q2_0.gguf bonsai27b.part-
          test "$(find . -maxdepth 1 -name 'bonsai27b.part-*' | wc -l)" -eq 16
          sha256sum bonsai27b.part-* | tee model-parts-sha256.txt
          stat -c '%n %s' bonsai27b.part-* | tee model-parts-size.txt
          df -h . | tee disk-after.txt
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-00, path: bonsai27b.part-00, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-01, path: bonsai27b.part-01, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-02, path: bonsai27b.part-02, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-03, path: bonsai27b.part-03, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-04, path: bonsai27b.part-04, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-05, path: bonsai27b.part-05, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-06, path: bonsai27b.part-06, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-07, path: bonsai27b.part-07, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-08, path: bonsai27b.part-08, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-09, path: bonsai27b.part-09, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-10, path: bonsai27b.part-10, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-11, path: bonsai27b.part-11, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-12, path: bonsai27b.part-12, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-13, path: bonsai27b.part-13, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-14, path: bonsai27b.part-14, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: bonsai27b-part-15, path: bonsai27b.part-15, compression-level: 0, retention-days: 1, if-no-files-found: error}
      - name: Upload model manifest
        uses: actions/upload-artifact@v4
        with:
          name: bonsai27b-shard-manifest
          path: |
            model-size.txt
            model-sha256.txt
            model-parts-sha256.txt
            model-parts-size.txt
            disk-before.txt
            disk-after.txt
          retention-days: 1
