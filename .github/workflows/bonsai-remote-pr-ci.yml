name: Bonsai Remote PR CI

on:
  pull_request:
    branches:
      - main
    paths:
      - bonsai-kernel-lab/**
      - experiments/bonsai-remote-kernel-ci/**
  workflow_dispatch:

concurrency:
  group: bonsai-remote-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRISM_REPO: https://github.com/PrismML-Eng/llama.cpp.git
  PRISM_REF: 9ca265a57f85f2117942490f421f64a226dd9847
  MODEL_SHA256: 868c11714cf8fe47f5ec9eeb2be0ab1a337112886f92ee0ede6b855c4fa31757

jobs:
  microkernels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record runner CPU
        run: lscpu | tee cpu.txt
      - name: Build and run AVX2 row benchmark
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -mavx2 -mfma -mssse3 bonsai-kernel-lab/q2_avx2_row_bench.c -lm -o q2_avx2_row_bench
          ./q2_avx2_row_bench | tee q2_avx2_row_bench.txt
      - name: Build VNNI row benchmark and run when supported
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -march=icelake-server -mavx512vnni -mavx512vl -mavx512bw -mavx512f \
            bonsai-kernel-lab/q2_vnni_row_bench.c -lm -o q2_vnni_row_bench
          if grep -qw avx512_vnni /proc/cpuinfo; then
            ./q2_vnni_row_bench | tee q2_vnni_row_bench.txt
          else
            echo 'COMPILE_PASS; EXECUTION_SKIPPED_NO_AVX512_VNNI' | tee q2_vnni_row_bench.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: q2-x86-microkernel-evidence
          path: |
            cpu.txt
            q2_avx2_row_bench.txt
            q2_vnni_row_bench.txt

  runtime-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache
      - name: Fetch exact Prism source
        run: |
          git clone --filter=blob:none "$PRISM_REPO" prism-llama
          cd prism-llama
          git checkout --detach "$PRISM_REF"
          git rev-parse HEAD | tee ../prism-head.txt
      - name: Apply combined VNNI and AVX2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp prism-llama/ggml/src/ggml-cpu/arch/x86/quants.c quants.pristine.c
          python3 bonsai-kernel-lab/apply_q2_candidate.py prism-llama/ggml/src/ggml-cpu/arch/x86/quants.c
          cd prism-llama
          git diff --check
          git diff -- ggml/src/ggml-cpu/arch/x86/quants.c | tee ../candidate.patch
          test -s ../candidate.patch
      - name: Configure native runner build
        working-directory: prism-llama
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=ON -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF
      - name: Build native runtime and full test inventory
        working-directory: prism-llama
        run: cmake --build build-native --parallel 2
      - name: Run focused native correctness tests
        working-directory: prism-llama/build-native
        shell: bash
        run: |
          set -euo pipefail
          ctest --output-on-failure -R 'test-quantize-fns|test-backend-ops' | tee ../../focused-tests.txt
      - name: Run complete native test suite and preserve all results
        working-directory: prism-llama/build-native
        shell: bash
        run: |
          set +e
          ctest --output-on-failure -j2 | tee ../../all-tests.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ../../all-tests-exit-code.txt
          exit 0
      - name: Configure explicit AVX-512 VNNI compile-only build
        working-directory: prism-llama
        run: |
          cmake -S . -B build-avx512 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON \
            -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON \
            -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF
      - name: Compile AVX-512 candidate without executing on the AMD runner
        working-directory: prism-llama
        run: |
          cmake --build build-avx512 --target llama-bench test-quantize-fns test-backend-ops --parallel 2
      - name: Package binaries and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-artifact/native/bin runtime-artifact/avx512-compile-only/bin runtime-artifact/evidence
          for f in llama-cli llama-server llama-bench; do
            test -f "prism-llama/build-native/bin/$f"
            cp "prism-llama/build-native/bin/$f" runtime-artifact/native/bin/
          done
          for f in llama-bench test-quantize-fns test-backend-ops; do
            test -f "prism-llama/build-avx512/bin/$f"
            cp "prism-llama/build-avx512/bin/$f" runtime-artifact/avx512-compile-only/bin/
          done
          cp prism-head.txt candidate.patch quants.pristine.c runtime-artifact/evidence/
          cp prism-llama/ggml/src/ggml-cpu/arch/x86/quants.c runtime-artifact/evidence/quants.patched.c
          cp bonsai-kernel-lab/apply_q2_candidate.py runtime-artifact/evidence/
          cp focused-tests.txt all-tests.txt all-tests-exit-code.txt runtime-artifact/evidence/ 2>/dev/null || true
          sha256sum runtime-artifact/native/bin/* | tee runtime-artifact/evidence/native-binary-sha256.txt
          sha256sum runtime-artifact/avx512-compile-only/bin/* | tee runtime-artifact/evidence/avx512-binary-sha256.txt
          c++ --version | head -1 | tee runtime-artifact/evidence/compiler.txt
          cmake --version | head -1 | tee runtime-artifact/evidence/cmake.txt
          lscpu | tee runtime-artifact/evidence/runner-cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patched-prism-runtime
          path: runtime-artifact

  end-to-end-ternary-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache curl
      - name: Fetch exact source and inspect resources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$PRISM_REPO" prism-llama
          cd prism-llama
          git checkout --detach "$PRISM_REF"
          cd ..
          lscpu | tee runner-cpu.txt
          free -h | tee memory-before.txt
          swapon --show | tee swap-before.txt || true
          df -h . | tee disk-before.txt
      - name: Build pristine native runtime
        working-directory: prism-llama
        run: |
          cmake -S . -B build-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=ON -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build build-baseline --target llama-bench --parallel 2
      - name: Apply candidate and build native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 bonsai-kernel-lab/apply_q2_candidate.py prism-llama/ggml/src/ggml-cpu/arch/x86/quants.c
          cd prism-llama
          git diff --check
          cmake -S . -B build-candidate -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=ON -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build build-candidate --target llama-bench --parallel 2
      - name: Download and verify public model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 -o Ternary-Bonsai-27B-Q2_0.gguf \
            https://huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf/resolve/main/Ternary-Bonsai-27B-Q2_0.gguf
          sha256sum Ternary-Bonsai-27B-Q2_0.gguf | tee model-sha256.txt
          test "$(sha256sum Ternary-Bonsai-27B-Q2_0.gguf | awk '{print $1}')" = "$MODEL_SHA256"
          cat Ternary-Bonsai-27B-Q2_0.gguf >/dev/null
      - name: Warm both runtimes
        shell: bash
        run: |
          set -euo pipefail
          ./prism-llama/build-baseline/bin/llama-bench -m Ternary-Bonsai-27B-Q2_0.gguf -p 16 -n 8 -r 1 -t 4 -ngl 0 > warm-baseline.txt 2>&1
          ./prism-llama/build-candidate/bin/llama-bench -m Ternary-Bonsai-27B-Q2_0.gguf -p 16 -n 8 -r 1 -t 4 -ngl 0 > warm-candidate.txt 2>&1
      - name: Matched ABBA benchmark
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v ./prism-llama/build-baseline/bin/llama-bench \
            -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 128 -r 3 -t 4 -ngl 0 \
            2>&1 | tee baseline-a.txt
          /usr/bin/time -v ./prism-llama/build-candidate/bin/llama-bench \
            -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 128 -r 3 -t 4 -ngl 0 \
            2>&1 | tee candidate-a.txt
          /usr/bin/time -v ./prism-llama/build-candidate/bin/llama-bench \
            -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 128 -r 3 -t 4 -ngl 0 \
            2>&1 | tee candidate-b.txt
          /usr/bin/time -v ./prism-llama/build-baseline/bin/llama-bench \
            -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 128 -r 3 -t 4 -ngl 0 \
            2>&1 | tee baseline-b.txt
          free -h | tee memory-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: end-to-end-ternary-benchmark
          path: |
            model-sha256.txt
            runner-cpu.txt
            memory-before.txt
            memory-after.txt
            swap-before.txt
            disk-before.txt
            warm-baseline.txt
            warm-candidate.txt
            baseline-a.txt
            baseline-b.txt
            candidate-a.txt
            candidate-b.txt
