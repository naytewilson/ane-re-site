name: Bonsai Remote PR CI

on:
  pull_request:
    branches:
      - main
    paths:
      - experiments/bonsai-remote-kernel-ci/**
      - .github/workflows/bonsai-remote-build.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PRISM_REPO: https://github.com/PrismML-Eng/llama.cpp.git
  PRISM_REF: 9ca265a57f85f2117942490f421f64a226dd9847

jobs:
  microkernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record CPU and compile harness
        shell: bash
        run: |
          set -euo pipefail
          lscpu | tee cpu.txt
          cc -O3 -march=icelake-server -mavx512vnni -mavx512vl -mavx512bw -mavx512f \
            experiments/bonsai-remote-kernel-ci/q2_vnni_bench.c -o q2_vnni_bench
          if grep -qw avx512_vnni /proc/cpuinfo; then
            ./q2_vnni_bench | tee q2_vnni_bench.txt
          else
            echo 'COMPILE_PASS; EXECUTION_SKIPPED_NO_AVX512_VNNI' | tee q2_vnni_bench.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: microkernel-evidence
          path: |
            cpu.txt
            q2_vnni_bench.txt

  runtime-build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache
      - name: Fetch exact Prism source
        run: |
          git clone --filter=blob:none "$PRISM_REPO" prism-llama
          cd prism-llama
          git checkout --detach "$PRISM_REF"
          git rev-parse HEAD | tee ../prism-head.txt
      - name: Apply candidate robustly
        working-directory: prism-llama
        shell: bash
        run: |
          set -euo pipefail
          cp ggml/src/ggml-cpu/arch/x86/quants.c ../quants.pristine.c
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ggml/src/ggml-cpu/arch/x86/quants.c')
          lines = p.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if 'const int dp = hsum_i32_8(GGML_DPBUSD_256' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one Q2_0 dp line, found {len(matches)}')
          i = matches[0]
          if i + 2 >= len(lines):
              raise SystemExit('truncated target')
          if 'const int sy = hsum_i32_8(GGML_DPBUSD_256' not in lines[i + 1]:
              raise SystemExit('Q2_0 sy line not adjacent')
          if 'sumi += d1 * (float)(dp - sy);' not in lines[i + 2]:
              raise SystemExit('Q2_0 accumulation line not adjacent')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          nl = '\n' if lines[i].endswith('\n') else ''
          lines[i] = indent + 'const __m256i dp = GGML_DPBUSD_256(_mm256_setzero_si256(), codes, qy);' + nl
          lines[i + 1] = indent + 'const __m256i sy = GGML_DPBUSD_256(_mm256_setzero_si256(), ones,  qy);' + nl
          lines[i + 2] = indent + 'sumi += d1 * (float) hsum_i32_8(_mm256_sub_epi32(dp, sy));' + nl
          p.write_text(''.join(lines))
          PY
          git diff --check
          git diff -- ggml/src/ggml-cpu/arch/x86/quants.c | tee ../candidate.patch
          test -s ../candidate.patch
      - name: Configure and build
        working-directory: prism-llama
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON \
            -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON \
            -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF
          cmake --build build --parallel 2
      - name: Test
        working-directory: prism-llama/build
        shell: bash
        run: |
          set -o pipefail
          ctest --output-on-failure -R 'test-quantize-fns|test-backend-ops' | tee ../../focused-tests.txt
          ctest --output-on-failure -j2 | tee ../../all-tests.txt
      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-artifact/bin runtime-artifact/evidence
          cp prism-llama/build/bin/llama-cli runtime-artifact/bin/
          cp prism-llama/build/bin/llama-server runtime-artifact/bin/
          cp prism-llama/build/bin/llama-bench runtime-artifact/bin/
          cp prism-head.txt candidate.patch focused-tests.txt all-tests.txt quants.pristine.c runtime-artifact/evidence/
          cp prism-llama/ggml/src/ggml-cpu/arch/x86/quants.c runtime-artifact/evidence/quants.patched.c
          sha256sum runtime-artifact/bin/* | tee runtime-artifact/evidence/binary-sha256.txt
          c++ --version | head -1 | tee runtime-artifact/evidence/compiler.txt
          cmake --version | head -1 | tee runtime-artifact/evidence/cmake.txt
      - uses: actions/upload-artifact@v4
        with:
          name: patched-prism-runtime
          path: runtime-artifact

  end-to-end-ternary-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache curl
      - name: Fetch source and establish memory safety margin
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$PRISM_REPO" prism-llama
          cd prism-llama
          git checkout --detach "$PRISM_REF"
          cd ..
          if swapon --show --noheadings | grep -q .; then
            echo 'Runner already has active swap; preserving it.'
          else
            SWAP_PATH=/mnt/bonsai-swapfile
            sudo fallocate -l 8G "$SWAP_PATH" || true
            if [ -f "$SWAP_PATH" ]; then
              sudo chmod 600 "$SWAP_PATH"
              sudo mkswap "$SWAP_PATH" || true
              sudo swapon "$SWAP_PATH" || true
            fi
          fi
          free -h
          swapon --show || true
          df -h .
      - name: Build pristine runtime
        working-directory: prism-llama
        run: |
          cmake -S . -B build-baseline -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build build-baseline --target llama-bench --parallel 2
      - name: Patch and build candidate runtime
        working-directory: prism-llama
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ggml/src/ggml-cpu/arch/x86/quants.c')
          lines = p.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if 'const int dp = hsum_i32_8(GGML_DPBUSD_256' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one Q2_0 dp line, found {len(matches)}')
          i = matches[0]
          if 'const int sy = hsum_i32_8(GGML_DPBUSD_256' not in lines[i + 1]:
              raise SystemExit('Q2_0 sy line not adjacent')
          if 'sumi += d1 * (float)(dp - sy);' not in lines[i + 2]:
              raise SystemExit('Q2_0 accumulation line not adjacent')
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          nl = '\n' if lines[i].endswith('\n') else ''
          lines[i] = indent + 'const __m256i dp = GGML_DPBUSD_256(_mm256_setzero_si256(), codes, qy);' + nl
          lines[i + 1] = indent + 'const __m256i sy = GGML_DPBUSD_256(_mm256_setzero_si256(), ones,  qy);' + nl
          lines[i + 2] = indent + 'sumi += d1 * (float) hsum_i32_8(_mm256_sub_epi32(dp, sy));' + nl
          p.write_text(''.join(lines))
          PY
          git diff --check
          cmake -S . -B build-candidate -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_CURL=OFF
          cmake --build build-candidate --target llama-bench --parallel 2
      - name: Download and verify model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 10 -o Ternary-Bonsai-27B-Q2_0.gguf \
            https://huggingface.co/prism-ml/Ternary-Bonsai-27B-gguf/resolve/main/Ternary-Bonsai-27B-Q2_0.gguf
          sha256sum Ternary-Bonsai-27B-Q2_0.gguf | tee model-sha256.txt
          test "$(sha256sum Ternary-Bonsai-27B-Q2_0.gguf | awk '{print $1}')" = "868c11714cf8fe47f5ec9eeb2be0ab1a337112886f92ee0ede6b855c4fa31757"
      - name: Matched benchmark
        shell: bash
        run: |
          set -euo pipefail
          lscpu | tee runner-cpu.txt
          free -h | tee memory-before.txt
          ./prism-llama/build-baseline/bin/llama-bench -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 32 -r 3 -t 4,8 -ngl 0 | tee baseline-bench.txt
          sync
          ./prism-llama/build-candidate/bin/llama-bench -m Ternary-Bonsai-27B-Q2_0.gguf -p 64 -n 32 -r 3 -t 4,8 -ngl 0 | tee candidate-bench.txt
          free -h | tee memory-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: end-to-end-ternary-benchmark
          path: |
            model-sha256.txt
            runner-cpu.txt
            memory-before.txt
            memory-after.txt
            baseline-bench.txt
            candidate-bench.txt
